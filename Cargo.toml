[package]
name         = "wharfedale-sdk"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.88"
description  = "Client SDK for Wharfedale: keys, addresses, RPC/Esplora client, confidential transactions, issuance, SimplicityHL contracts"
license      = "MIT OR Apache-2.0"
publish      = false

[dependencies]
elements        = "0.27.0"
hex             = "0.4.3"
rand            = { version = "0.8.5", features = ["std_rng"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1.0"
simplicity-lang = { version = "0.9.0", features = ["elements"] }
simplicityhl    = "0.9.0"
thiserror       = "2"
ureq            = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
rand = { version = "0.8.5", features = ["std_rng"] }

[profile.dev.package.secp256k1-zkp]
overflow-checks = false
